[workspace]
resolver = "2"
members = [
    "shade-tree-proto",
    "shade-tree-client",
    "shade-tree-egress",
    "shade-tree-rln",
]
# shade-tree-rln (T-RUST-2b RLN-INTEROP) has a heavy dep tree (ark-circom -> wasmer). Keep
# it OUT of default-members so the everyday `cargo build` / `cargo test` only touch
# the fast shade-tree-proto + shade-tree-client crates; build the RLN probe with `-p shade-tree-rln`.
default-members = [
    "shade-tree-proto",
    "shade-tree-client",
]

# Shared release profile for the distributable binary (T-RUST-4).
# A single static binary is the whole point of the Rust client (see
# docs/adr/0001-client-language.md), so optimize for size + strip by default.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
