name: ci

# Runs on every push and PR. Three gates an auditor also runs locally:
#   test  -- the full suite (node selftests + forge test) across a Node matrix
#   lint  -- `npm run lint` (eslint bug net, not a formatter)
#   audit -- `npm run audit:ci` supply-chain gate (blocks on critical advisories)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run the full suite (node selftests + forge test)
        run: npm test

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

  audit:
    name: supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci || npm install

      # Blocking gate: fails CI on any *critical* advisory. Passes today.
      - name: Audit (blocking, critical)
        run: npm run audit:ci

      # Informational: surfaces the known *high* advisories without blocking.
      # These are unavoidable transitive advisories in the prod crypto stack
      # (ethers -> ws, @semaphore-protocol -> snarkjs, socks -> ip-address,
      # etc.); the only npm-offered fix downgrades @semaphore-protocol/proof to
      # 3.15.2, a breaking change. Tracked via Dependabot instead of blocked on.
      - name: Audit (informational, high)
        continue-on-error: true
        run: npm audit --audit-level=high
